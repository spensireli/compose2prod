services:
  web:
    image: nginx:1.27
    platform: linux/arm64
    command: ["nginx", "-g", "daemon off;"]
    environment:
      APP_ENV: test
      FEATURE_ENABLED: true
      IGNORED: null
    ports:
      - "8080:80"
      - target: 8125
        protocol: udp
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
  worker:
    image: example/worker:latest
    command: run jobs
    environment:
      - QUEUE=default
